<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>A&N Agro — نظام إدارة المحل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<style>
:root{
  --bg:#f2f6f3;--card:#ffffff;--tx:#0f1f18;--mut:#6b7c73;--g:#0d4f32;--g2:#1a7a4c;
  --gold:#c9a227;--gold2:#e8c547;--bd:#dce6df;--side:#081f16;--w:#b45309;--r:#b91c1c;--ok:#059669;
  --shadow:0 8px 28px rgba(13,79,50,.07);--radius:18px;
}
html.dark{
  --bg:#0a120e;--card:#132019;--tx:#e8f0eb;--mut:#8fa39a;--bd:#24332c;
  --g:#2f9e5f;--g2:#3bb870;--w:#f0a040;--r:#f06b6b;--shadow:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top)}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
img{max-width:100%}
button,input,select{font:inherit}
.hidden{display:none!important}

/* Splash — clean & short */
#sp{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#0f5132 0%,#07190f 70%);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s,transform .45s}
#sp.h{opacity:0;pointer-events:none;transform:scale(1.03)}
#sp img{width:min(160px,42vw);border-radius:28px;box-shadow:0 16px 48px rgba(0,0,0,.45),0 0 0 3px rgba(201,162,39,.35);animation:logoIn .8s ease}
@keyframes logoIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
#sp .sp-name{color:#fff;font:800 22px Cairo;letter-spacing:.3px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
#sp .sp-gold{width:48px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#c9a227,transparent)}
.pb{width:min(220px,62vw);height:6px;background:rgba(255,255,255,.14);border-radius:10px;overflow:hidden}
#pb{height:100%;width:0%;background:linear-gradient(90deg,#c9a227,#e8c547,#c9a227);background-size:200% 100%;transition:width .18s ease-out;border-radius:10px}
#pt{color:rgba(255,255,255,.85);font:700 13px Cairo;letter-spacing:.5px;min-height:18px}

/* Header */
header{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--side),#0f3d28);color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-top));box-shadow:0 2px 12px rgba(0,0,0,.2)}
header .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
header .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
header .brand img{width:42px;height:42px;border-radius:10px;object-fit:cover;border:2px solid rgba(255,255,255,.25)}
header .brand b{font-size:15px;line-height:1.3}
header .brand small{display:block;opacity:.75;font-size:11px;font-weight:400}
header .quick-tools{display:flex;align-items:center;gap:6px;flex-shrink:0}
header .quick-tools button{
  width:38px;height:38px;border:0;border-radius:11px;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.15);padding:0;line-height:1
}
header .quick-tools button:active{transform:scale(.92);background:rgba(255,255,255,.28)}
header .quick-tools button.on{background:rgba(201,162,39,.95);color:#1a1408}
/* Bottom bar: menu left, chat right */
#botbar{position:fixed;bottom:0;left:0;right:0;z-index:70;display:grid;grid-template-columns:1fr auto 1fr;direction:ltr;align-items:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -4px 20px rgba(0,0,0,.08);gap:6px}
.bot-left{display:flex;align-items:center;justify-content:flex-start}
.bot-center{display:flex;align-items:center;justify-content:center}
.bot-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.menu-btn{width:44px;height:44px;border:0;border-radius:12px;background:var(--side);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.menu-btn span{display:block;width:17px;height:2.5px;background:#fff;border-radius:2px;transition:.2s}
.menu-btn.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.menu-btn.open span:nth-child(2){opacity:0}
.menu-btn.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
/* Home PIP — circular floating bubble */
.home-btn{width:60px;height:60px;border:3px solid #fff;border-radius:50%;background:linear-gradient(145deg,#22a35a,#0f5132);color:#fff;font:800 24px Cairo;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(15,81,50,.45),0 0 0 1px rgba(15,81,50,.12);position:relative;top:-16px}
.home-btn:active{transform:scale(.9)}
/* Back — clean chip */
.back-btn{height:38px;padding:0 16px 0 12px;border:0;border-radius:20px;background:#13241c;color:#f0f7f3;font:700 13px Cairo;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.back-btn::before{content:'→';font-size:15px;opacity:.85;line-height:1}
.back-btn:active{transform:scale(.95);opacity:.9}
/* Floating chat PIP */
#fabChat{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));right:14px;left:auto;z-index:44;border:3px solid #fff;border-radius:50px;padding:12px 18px 12px 14px;background:linear-gradient(135deg,#d4af37,#b8962a);color:#1a1408;font:800 13px Cairo;cursor:pointer;box-shadow:0 10px 30px rgba(184,150,42,.55),0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;white-space:nowrap}
#fabChat:active{transform:scale(.94)}
#fabChat .fab-dot{width:10px;height:10px;border-radius:50%;background:#0f5132;flex:none;box-shadow:0 0 0 3px rgba(15,81,50,.2);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(15,81,50,.2)}50%{box-shadow:0 0 0 8px rgba(15,81,50,.06)}}

/* Drawer — opens from left (LTR side in RTL layout = physical left) */
#drawer{position:fixed;inset:0;z-index:50;pointer-events:none}
#drawer.on{pointer-events:auto}
#drawer .backdrop{position:absolute;inset:0;background:#0000;transition:.25s}
#drawer.on .backdrop{background:#0007}
#drawer .panel{position:absolute;top:0;left:0;height:100%;width:min(300px,86vw);background:var(--side);color:#cfe3d8;padding:18px 12px;transform:translateX(-105%);transition:.28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;display:flex;flex-direction:column;gap:4px}
#drawer.on .panel{transform:none}
#drawer .panel h4{color:#e0b83a;font-size:12px;margin:12px 8px 6px;opacity:.9}
#drawer button{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;border:0;color:#cfe3d8;padding:12px 14px;border-radius:12px;font:600 14px Cairo;cursor:pointer}
#drawer button:active,#drawer button.on{background:var(--g2);color:#fff}
#drawer .ico{width:28px;text-align:center;font-size:18px}

/* Main */
main{padding:14px;max-width:720px;margin:0 auto}
h1{font-size:18px;margin:0 0 12px;color:var(--g)}
h3{font-size:15px;margin:0 0 8px}

/* Cards & grids — always 2 square buttons side by side */
.kg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.k{background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.45);border-radius:var(--radius);padding:18px 14px;box-shadow:0 8px 28px rgba(13,79,50,.08);cursor:pointer;transition:.18s;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
html.dark .k{background:rgba(19,32,25,.65);border-color:rgba(255,255,255,.08)}
.k:active{transform:scale(.97)}
.top-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 4px 6px}
.top-actions button{padding:14px 12px;border:0;border-radius:16px;font:800 14px Cairo;cursor:pointer;box-shadow:0 6px 20px rgba(13,79,50,.15)}
.top-actions .ta-prod{background:linear-gradient(135deg,#0f5132,#1a7a4a);color:#fff}
.top-actions .ta-scan{background:linear-gradient(135deg,#c9a227,#b8962a);color:#1a1408}
.ta-search-wrap{display:flex;justify-content:center;margin:4px 4px 10px}
.ta-search{width:min(100%,280px);padding:13px 18px;border:0;border-radius:16px;font:800 14px Cairo;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1d4ed8,#2563eb);box-shadow:0 6px 20px rgba(37,99,235,.28)}
.ta-search:active{transform:scale(.97)}
/* كروت الرئيسية الملونة */
.k.c-sales{background:linear-gradient(160deg,#ecfdf5 0%,#d1fae5 100%);border-color:#a7f3d0}
.k.c-sales b{color:#047857}
html.dark .k.c-sales{background:linear-gradient(160deg,#0f2a1e,#134e37);border-color:#1a5c40}
html.dark .k.c-sales b{color:#6ee7b7}
.k.c-stock{background:linear-gradient(160deg,#eff6ff 0%,#dbeafe 100%);border-color:#93c5fd}
.k.c-stock b{color:#1d4ed8}
html.dark .k.c-stock{background:linear-gradient(160deg,#0f1c2e,#1e3a5f);border-color:#1e4a7a}
html.dark .k.c-stock b{color:#93c5fd}
.k.c-cust{background:linear-gradient(160deg,#fff7ed 0%,#ffedd5 100%);border-color:#fdba74}
.k.c-cust b{color:#c2410c}
html.dark .k.c-cust{background:linear-gradient(160deg,#2a1a0c,#3d2410);border-color:#7c4a1e}
html.dark .k.c-cust b{color:#fdba74}
.k.c-alert{background:linear-gradient(160deg,#fef2f2 0%,#fee2e2 100%);border-color:#fca5a5}
.k.c-alert b{color:#b91c1c}
html.dark .k.c-alert{background:linear-gradient(160deg,#2a1212,#3f1a1a);border-color:#7f1d1d}
html.dark .k.c-alert b{color:#fca5a5}
.k.c-warn{background:linear-gradient(160deg,#fffbeb 0%,#fef3c7 100%);border-color:#fcd34d}
.k.c-warn b{color:#b45309}
html.dark .k.c-warn{background:linear-gradient(160deg,#2a220c,#3d3010);border-color:#78520e}
html.dark .k.c-warn b{color:#fcd34d}
.k.c-profit{background:linear-gradient(160deg,#f0fdf4 0%,#bbf7d0 100%);border-color:#86efac}
.k.c-profit b{color:#15803d}
html.dark .k.c-profit{background:linear-gradient(160deg,#0f2a18,#14532d);border-color:#166534}
html.dark .k.c-profit b{color:#86efac}
.k.flat{aspect-ratio:auto;min-height:auto;padding:14px}
.k:active{transform:scale(.97)}
.k .ico{font-size:28px;margin-bottom:8px;line-height:1}
.k.flat .ico{font-size:20px;margin-bottom:4px}
.k small{color:var(--mut);display:block;font-size:12px;margin-bottom:4px}
.k b{font-size:17px;display:block;line-height:1.3}
.k.gd b{color:var(--g2)}.k.bd b{color:var(--r)}.k.wa b{color:var(--w)}
.k.feat{grid-column:1/-1;aspect-ratio:auto;min-height:88px;flex-direction:row;justify-content:flex-start;gap:14px;padding:18px 20px;background:linear-gradient(135deg,#0f5132,#1a7a4a);border:0;color:#fff;box-shadow:0 8px 28px rgba(15,81,50,.35)}
.k.feat .ico{font-size:36px;margin:0}
.k.feat small{color:rgba(255,255,255,.8);font-size:13px;margin:0}
.k.feat b{color:#fff;font-size:20px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.prod-pick{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto;margin:8px 0}
.prod-pick button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);cursor:pointer;font:600 13px Cairo}
.prod-pick button:active{background:var(--g2);color:#fff;border-color:var(--g2)}
.prod-pick button small{font-weight:400;opacity:.75}
.cal-wrap{direction:ltr;max-width:420px;margin:0 auto}
.cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px;direction:ltr}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:ltr}
.cal-cell{aspect-ratio:1;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:700 14px Cairo;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;min-height:40px}
.cal-cell.empty{border:0;background:transparent;cursor:default;pointer-events:none}
.cal-cell.has{border-color:var(--g2);background:#e8f5ee}
html.dark .cal-cell.has{background:rgba(59,184,112,.18)}
.cal-cell.soon{border-color:var(--w);background:#fff7ed}
html.dark .cal-cell.soon{background:rgba(240,160,64,.15)}
.cal-cell.today{box-shadow:0 0 0 2px var(--g2);font-weight:800}
.cal-cell .d{line-height:1}
.cal-cell .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);min-width:16px;height:15px;border-radius:8px;background:var(--g2);color:#fff;font-size:9px;line-height:15px;padding:0 4px;font-weight:700}
.cal-cell.soon .dot{background:var(--w)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;direction:rtl}
.cal-nav b{font-size:15px;color:var(--g)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
@media(min-width:520px){.pgrid{grid-template-columns:repeat(3,1fr)}}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:160px}
.pcard .pn{font-weight:800;font-size:15px;line-height:1.35}
.pcard .pm{font-size:12px;color:var(--mut)}
.pcard .pr{font-size:18px;font-weight:800;color:var(--g2)}
.pcard .pq{font-size:13px}
.pcard .pq.low{color:var(--r);font-weight:700}
.pcard .pact{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pcard .pact button{flex:1;min-width:64px;justify-content:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .hd{font-size:11px;color:var(--mut);padding:4px}
.cal .day{aspect-ratio:1;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font:600 13px Cairo;cursor:pointer;position:relative}
.cal .day.mut{opacity:.35}
.cal .day.today{outline:2px solid var(--g2)}
.cal .day.has{background:#e8f5ee;color:var(--g)}
.cal .day.has::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--w)}
.cal .day.warn{background:#fff3e0;color:var(--w)}
.cal .day.due{background:#fde8e8;color:var(--r)}
.pay-opt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pay-opt button{padding:16px;border:2px solid var(--bd);border-radius:14px;background:var(--card);font:700 15px Cairo;cursor:pointer;color:var(--tx)}
.pay-opt button.on{border-color:var(--g2);background:#e8f5ee;color:var(--g)}
.inst-row{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;align-items:center;margin:6px 0}
.g2{display:grid;gap:12px}
@media(min-width:560px){.g2{grid-template-columns:1fr 1fr}}

/* Bars & forms */
.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
.bar input,.bar select{flex:1;min-width:120px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:14px Cairo}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
.b,.s{border:0;border-radius:10px;padding:10px 16px;font:600 13px Cairo;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b{background:var(--g2);color:#fff}.b:active{filter:brightness(.92)}
.s{background:var(--bd);color:var(--tx);padding:8px 12px}
.b.danger{background:var(--r)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--bd);font-size:12px;margin:2px}

/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px}
tr:active{background:rgba(26,122,74,.06)}
.r{color:var(--r)}.w{color:var(--w)}.ok{color:var(--ok)}
.n{width:70px!important;text-align:center}

/* Modal */
.mb{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0 0 calc(76px + env(safe-area-inset-bottom));animation:fade .2s}
@media(min-width:520px){.mb{align-items:center;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}}
@keyframes fade{from{opacity:0}}
.mc{background:var(--card);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:440px;max-height:calc(100vh - 110px - env(safe-area-inset-bottom));max-height:calc(100dvh - 110px - env(safe-area-inset-bottom));overflow:auto;animation:up .25s}
@media(min-width:520px){.mc{border-radius:20px}}
@keyframes up{from{transform:translateY(30px)}}
.mc h3{margin-bottom:12px}
pre{white-space:pre-wrap;font-family:inherit;line-height:1.7;font-size:14px}

/* Home hero */
.hero{text-align:center;padding:22px 12px 12px}
.hero img{box-shadow:0 12px 32px rgba(15,81,50,.18);border:3px solid rgba(201,162,39,.35)}
.hero img{width:110px;height:110px;border-radius:22px;object-fit:cover;box-shadow:0 8px 28px rgba(15,81,50,.25);border:3px solid var(--card)}
.hero h2{margin:12px 0 2px;font-size:20px;color:var(--g);cursor:pointer}
.hero p{color:var(--mut);font-size:13px}
.admin-badge{display:inline-block;background:var(--gold);color:#1a1a1a;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:6px}

/* Bottom safe area spacer already on body */
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:24px;z-index:90;font-size:13px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center}

/* Quantity controls */
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border:0;border-radius:8px;background:var(--g2);color:#fff;font-size:16px;cursor:pointer}

/* Empty state */
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty span{font-size:40px;display:block;margin-bottom:8px}

/* Chart bars */
.ch{display:flex;gap:5px;height:120px;align-items:stretch}
.ch>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mut)}
.ch i{width:70%;background:linear-gradient(180deg,var(--g2),#14532d);border-radius:5px 5px 0 0;min-height:3px}

/* Chat */
.chat #ms{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{padding:10px 14px;border-radius:14px;max-width:88%;line-height:1.7;font-size:14px}
.m.user{background:var(--g2);color:#fff;align-self:flex-start}
.m.assistant{background:var(--bg);align-self:flex-end;border:1px solid var(--bd)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
.chips .s{flex:none}

/* Unit tags */
.units{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.units .chip{cursor:pointer}
.units .chip.active{background:var(--g2);color:#fff;border-color:var(--g2)}

/* Alert badge */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--r);color:#fff;font-size:11px;font-weight:700;margin-right:4px}

/* Home sections */
.sec-t{display:flex;align-items:center;gap:8px;font:800 14px Cairo;color:var(--g);margin:18px 4px 8px}
.sec-t::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--gold)}
html.dark .sec-t{color:var(--g2)}
.sec-t+.kg{margin-bottom:6px}
/* Barcode scanner overlay */
.scan-ov{position:fixed;inset:0 0 calc(76px + env(safe-area-inset-bottom)) 0;z-index:65;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:14px}
.scan-box{background:var(--card);color:var(--tx);border-radius:20px;padding:16px;width:100%;max-width:440px;max-height:96vh;overflow:auto}
.scan-view{position:relative;width:100%;min-height:240px;background:#000;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scan-view video{width:100%;display:block}
.scan-view.live::after{content:'';position:absolute;left:12%;right:12%;top:50%;height:2px;background:#e8c547;box-shadow:0 0 8px #e8c547;pointer-events:none}
.scan-msg{color:#fff;font-size:14px;padding:18px;text-align:center;line-height:1.8}
#drawer .panel{padding-bottom:calc(96px + env(safe-area-inset-bottom))!important;overflow:auto}
.pgb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.copyr{text-align:center;font-size:11px;color:var(--mut);padding:10px 12px 4px;opacity:.85}

/* —— Premium home polish (layout unchanged) —— */
.hero{
  position:relative;
  padding:28px 16px 18px;
  margin:0 0 6px;
  border-radius:24px;
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, rgba(201,162,39,.18), transparent 55%),
    linear-gradient(180deg, rgba(15,81,50,.06), transparent 70%);
  overflow:hidden;
}
html.dark .hero{
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, rgba(201,162,39,.12), transparent 55%),
    linear-gradient(180deg, rgba(47,158,95,.08), transparent 70%);
}
.hero::after{
  content:'';
  position:absolute;left:12%;right:12%;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,162,39,.55),transparent);
  pointer-events:none;
}
.hero img{
  width:118px;height:118px;border-radius:26px;
  box-shadow:0 16px 40px rgba(15,81,50,.28),0 0 0 4px rgba(201,162,39,.28);
  border:3px solid rgba(255,255,255,.85);
}
html.dark .hero img{border-color:rgba(255,255,255,.12)}
.hero h2{
  font-size:22px;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--g),var(--g2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
html.dark .hero h2{background:linear-gradient(135deg,#6ee7b7,#2f9e5f);-webkit-background-clip:text;background-clip:text}
.top-actions button{
  position:relative;overflow:hidden;
  box-shadow:0 10px 28px rgba(13,79,50,.22), inset 0 1px 0 rgba(255,255,255,.18);
}
.top-actions .ta-prod{background:linear-gradient(145deg,#146b42,#0f5132 55%,#0a3d26)}
.top-actions .ta-scan{background:linear-gradient(145deg,#e8c547,#c9a227 55%,#a8861c);color:#1a1408}
.ta-search{
  background:linear-gradient(145deg,#2563eb,#1d4ed8 60%,#1e40af)!important;
  box-shadow:0 10px 26px rgba(37,99,235,.32), inset 0 1px 0 rgba(255,255,255,.2)!important;
}
.sec-t{
  font-size:13px;letter-spacing:.6px;text-transform:none;
  margin:22px 6px 10px;opacity:.95;
}
.sec-t::before{width:5px;height:18px;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.k{
  position:relative;overflow:hidden;
  border-radius:20px;
  box-shadow:0 10px 32px rgba(13,79,50,.09), inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .18s ease, box-shadow .18s ease;
}
html.dark .k{box-shadow:0 10px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04)}
.k::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.22),transparent 42%);
  opacity:.9;
}
html.dark .k::before{background:linear-gradient(145deg,rgba(255,255,255,.06),transparent 45%)}
.k:active{transform:scale(.965);box-shadow:0 4px 14px rgba(13,79,50,.12)}
.k .ico{filter:drop-shadow(0 2px 4px rgba(0,0,0,.08))}
.k b{font-size:18px;letter-spacing:-.2px}
.k.c-exp{background:linear-gradient(160deg,#fdf4ff 0%,#f3e8ff 100%);border-color:#d8b4fe}
.k.c-exp b{color:#7e22ce}
html.dark .k.c-exp{background:linear-gradient(160deg,#1f1228,#2e1a40);border-color:#5b2d7a}
html.dark .k.c-exp b{color:#d8b4fe}
.k.c-net{background:linear-gradient(160deg,#ecfeff 0%,#cffafe 100%);border-color:#67e8f9}
.k.c-net b{color:#0e7490}
html.dark .k.c-net{background:linear-gradient(160deg,#0c2428,#123a40);border-color:#155e75}
html.dark .k.c-net b{color:#67e8f9}
.net-banner{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  margin:12px auto 14px;padding:12px 10px;
  border-radius:16px;
  background:linear-gradient(135deg,#0f5132 0%,#1a7a4a 55%,#0f5132 100%);
  color:#fff;box-shadow:0 10px 28px rgba(15,81,50,.28);
  border:1px solid rgba(201,162,39,.35);
  max-width:420px;width:100%;
}
.net-banner > div{text-align:center}
.net-banner small{display:block;font-size:11px;opacity:.85;margin-bottom:4px;font-weight:600}
.net-banner b{font-size:15px;font-weight:800;letter-spacing:-.2px}
.net-banner .nb-exp{color:#fecaca}
.net-banner .nb-net{color:#fde68a}
header{
  background:linear-gradient(135deg,#07190f 0%,#0f3d28 48%,#14532d 100%);
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}
header .brand img{box-shadow:0 2px 10px rgba(0,0,0,.25)}
.home-btn{
  background:linear-gradient(145deg,#2bb86a,#0f5132);
  box-shadow:0 10px 28px rgba(15,81,50,.5),0 0 0 3px rgba(201,162,39,.25);
}
#fabChat{
  background:linear-gradient(135deg,#e8c547,#b8962a);
  box-shadow:0 12px 32px rgba(184,150,42,.5),0 2px 8px rgba(0,0,0,.15);
}

</style>

<script>
const OWNER_PHONE = '01092345910';
let ADMIN_PASS = (function(){ try{ return localStorage.getItem('an_agro_pass') || 'n910'; }catch{ return 'n910'; } })();
function getMuted(){ return !!(S?.settings?.muted); }
function setMuted(v){ if(!S.settings) S.settings={}; S.settings.muted=!!v; try{ localStorage.setItem('an_agro_muted', v?'1':'0'); }catch{} save(); syncQuickTools(); toast(v?'تم كتم الصوت':'تم تشغيل الصوت'); }
function toggleMute(){ setMuted(!getMuted()); }

/* ===== STATE ===== */
let S, doc=null, V='home', cart=[], msgs=[], cu=0, pq='', admin=false, tm;
let navItems = null; // customizable nav

const $ = s => document.querySelector(s);
const E = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = n => Math.round(+n||0).toLocaleString('ar-EG');
const M = n => N(n) + ' ج.م';
const D = o => { const d=new Date(); d.setDate(d.getDate()+o); return d.toISOString().slice(0,10); };
const T = D(0);
const dl = x => Math.round((new Date(x)-new Date(T))/864e5);
const P = id => S.p.find(x=>x.id==id);
const C = id => S.c.find(x=>x.id==id);
const sold = (id,d) => S.s.filter(s=>s.d>=D(-d)).reduce((a,s)=>a+s.it.filter(i=>i.p==id).reduce((b,i)=>b+i.q,0),0);
const prof = f => S.s.filter(s=>s.d>=f).reduce((a,s)=>a+s.it.reduce((b,i)=>b+(i.pr-i.co)*i.q,0),0);
const tot = (f,t='9') => S.s.filter(s=>s.d>=f&&s.d<=t).reduce((a,s)=>a+s.t,0);
const expTotal = (f,t='9') => (S.e||[]).filter(x=>x.d>=f&&x.d<=t).reduce((a,x)=>a+(+x.a||0),0);
const netSales = (f,t='9') => tot(f,t) - expTotal(f,t);
const netProfit = f => prof(f) - expTotal(f);

function waPhone(ph){
  let d=String(ph||'').replace(/\D/g,'');
  if(!d) d=String(OWNER_PHONE).replace(/\D/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  if(d.startsWith('0')) d='20'+d.slice(1);
  if(!d.startsWith('20')) d='20'+d;
  return d;
}
const wa = (ph,t) => 'https://wa.me/'+waPhone(ph)+'?text='+encodeURIComponent(t||'');
function openWa(ph,t){
  const url=wa(ph,t);
  const a=document.createElement('a');
  a.href=url; a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

function toast(t, withSound){
  const e=$('#tt'); e.textContent=t; e.style.display='block';
  setTimeout(()=>e.style.display='none',2800);
  if(withSound!==false) playBeep();
}
function playBeep(type){
  if(getMuted()) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    const t=type||'click';
    if(t==='success'){ o.type='sine'; o.frequency.value=980; g.gain.value=0.05; }
    else if(t==='warn'){ o.type='triangle'; o.frequency.value=420; g.gain.value=0.045; }
    else if(t==='nav'){ o.type='sine'; o.frequency.value=660; g.gain.value=0.03; }
    else { o.type='sine'; o.frequency.value=780; g.gain.value=0.035; }
    o.connect(g); g.connect(ctx.destination);
    o.start();
    const dur=t==='success'?0.18:0.12;
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur+0.02);
  }catch{}
}

let _scan=null;
function closeScan(){
  if(_scan){ try{_scan.stop();}catch{} _scan=null; }
  const o=$('#scanOv'); if(o) o.remove();
}
function scanBarcodeLive(onCode){
  closeScan();
  const ov=document.createElement('div'); ov.id='scanOv'; ov.className='scan-ov';
  ov.innerHTML=`<div class="scan-box">
    <h3 style="margin-bottom:10px">📷 وجّه الكاميرا للباركود</h3>
    <div id="scanView" class="scan-view"><div class="scan-msg" id="scanMsg">جاري تشغيل الكاميرا...</div></div>
    <div id="scanManualRow" class="bar hidden"><input id="scanManualIn" inputmode="numeric" placeholder="اكتب رقم الباركود"><button type="button" class="b" id="scanManualOk">تأكيد</button></div>
    <div class="bar" style="margin-top:10px;justify-content:center">
      <button type="button" class="s" id="scanPhoto">📸 التقاط صورة</button>
      <button type="button" class="s" id="scanManual">⌨️ كتابة</button>
      <button type="button" class="s" id="scanClose">إغلاق</button>
    </div>
    <input type="file" id="scanFile" accept="image/*" capture="environment" class="hidden">
  </div>`;
  document.body.appendChild(ov);
  let finished=false;
  const msg=t=>{ const m=$('#scanMsg'); if(m) m.textContent=t; };
  const finish=code=>{
    code=String(code||'').trim(); if(!code||finished) return;
    finished=true; closeScan();
    try{ navigator.vibrate&&navigator.vibrate(60); }catch{}
    onCode(code);
  };
  $('#scanClose').onclick=closeScan;
  $('#scanManual').onclick=()=>{ $('#scanManualRow').classList.toggle('hidden'); setTimeout(()=>$('#scanManualIn')?.focus(),50); };
  $('#scanManualOk').onclick=()=>finish($('#scanManualIn').value);
  $('#scanManualIn').onkeydown=e=>{ if(e.key==='Enter') finish(e.target.value); };
  $('#scanPhoto').onclick=()=>$('#scanFile').click();
  $('#scanFile').onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    toast('جاري قراءة الصورة...',false);
    let code=null;
    try{
      if('BarcodeDetector' in window){
        const bmp=await createImageBitmap(f);
        const r=await new BarcodeDetector().detect(bmp);
        code=r[0]?.rawValue||null;
      }
    }catch{}
    if(!code && window.Html5Qrcode){
      let tmp;
      try{
        tmp=document.createElement('div'); tmp.id='scanTmp'; tmp.style.display='none'; document.body.append(tmp);
        code=await new Html5Qrcode('scanTmp',false).scanFile(f,false);
      }catch{}
      if(tmp) tmp.remove();
    }
    if(code) finish(code);
    else toast('لم أتعرف على باركود — صوّر أقرب وأوضح أو اكتبه بالزر ⌨️');
    e.target.value='';
  };

  (async function start(){
    const view=$('#scanView');
    if(!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      msg('الكاميرا المباشرة غير متاحة هنا (المتصفح يشترط فتح الصفحة من رابط https). استخدم زر "📸 التقاط صورة" أو اكتب الباركود.');
      return;
    }
    try{
      if('BarcodeDetector' in window){
        let fmts=['ean_13','ean_8','code_128','code_39','qr_code','upc_a','upc_e'];
        try{ const sup=await BarcodeDetector.getSupportedFormats(); const f2=fmts.filter(x=>sup.includes(x)); if(f2.length) fmts=f2; }catch{}
        let st;
        try{ st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }
        catch(err){
          if(err&&err.name==='OverconstrainedError') st=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
          else throw err;
        }
        if(!$('#scanOv')){ st.getTracks().forEach(t=>t.stop()); return; }
        const v=document.createElement('video');
        v.muted=true; v.autoplay=true; v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
        v.srcObject=st;
        view.innerHTML=''; view.classList.add('live'); view.append(v);
        _scan={stop:()=>{ try{st.getTracks().forEach(t=>t.stop());}catch{} }};
        await v.play();
        const bd=new BarcodeDetector({formats:fmts});
        (async function loop(){
          if(finished||!$('#scanOv')) return;
          try{ if(v.readyState>=2){ const r=await bd.detect(v); if(r[0]?.rawValue){ finish(r[0].rawValue); return; } } }catch{}
          setTimeout(loop,250);
        })();
      } else if(window.Html5Qrcode){
        view.innerHTML=''; view.classList.add('live');
        const F=Html5QrcodeSupportedFormats;
        const h=new Html5Qrcode('scanView',{verbose:false,formatsToSupport:[F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.QR_CODE,F.UPC_A,F.UPC_E]});
        _scan={stop:()=>{ h.stop().then(()=>h.clear()).catch(()=>{}); }};
        await h.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},txt=>finish(txt),()=>{});
      } else {
        msg('متصفحك لا يدعم المسح المباشر. استخدم زر "📸 التقاط صورة" أو اكتب الباركود.');
      }
    }catch(err){
      const n=err&&err.name;
      let t='تعذر تشغيل الكاميرا — استخدم "📸 التقاط صورة" أو اكتب الباركود.';
      if(n==='NotAllowedError'||n==='SecurityError') t='تم رفض إذن الكاميرا. فعّله من إعدادات المتصفح للموقع ثم أعد المحاولة، أو استخدم "📸 التقاط صورة".';
      else if(n==='NotFoundError') t='لا توجد كاميرا في هذا الجهاز. استخدم "📸 التقاط صورة" أو اكتب الباركود.';
      else if(n==='NotReadableError') t='الكاميرا مستخدمة في تطبيق آخر. أغلقه وحاول مرة أخرى.';
      const vv=$('#scanView'); if(vv){ vv.classList.remove('live'); vv.innerHTML='<div class="scan-msg" id="scanMsg"></div>'; msg(t); }
    }
  })();
}
function cartSubtotal(){ return cart.reduce((a,i)=>a+i.q*(P(i.id)?.pr||0),0); }
function calcDiscount(sub){
  const pct=Math.max(0,+$('#discPct')?.value||0);
  const amt=Math.max(0,+$('#discAmt')?.value||0);
  let d=amt||0;
  if(pct) d=Math.max(d, sub*pct/100);
  d=Math.min(d, sub);
  return Math.round(d*100)/100;
}
function updDisc(){
  const sub=cartSubtotal();
  const d=calcDiscount(sub);
  const t=Math.round((sub-d)*100)/100;
  const tl=$('#totalLbl'), dl=$('#discLbl');
  if(tl) tl.textContent='الإجمالي: '+M(t);
  if(dl){ dl.classList.toggle('hidden', !d); dl.textContent=d?('بعد خصم '+M(d)+' من '+M(sub)):''; }
}
function chk(){
  if(!cart.length) return toast('السلة فارغة');

  const t=Math.round((sub-disc)*100)/100;

  window._saleSub=sub;

function updInstRemain(t){

  if(el) el.innerHTML=`المتبقي: <b class="r">${M(rem)}</b>`;

}
function buildInstRows(t){
  const paid=Math.max(0,+$('#instPaid')?.value||0);
  const rem=Math.max(0, Math.round((t-paid)*100)/100);
  let n=Math.max(1, Math.min(24, +$('#instCount')?.value||1));
  const box=$('#instRows'); if(!box) return;
  const each=Math.round((rem/n)*100)/100;
  let allocated=0;
  const rows=[];
  for(let i=0;i<n;i++){
    const amt=i===n-1? Math.round((rem-allocated)*100)/100 : each;
    allocated=Math.round((allocated+amt)*100)/100;
    const d=new Date(); d.setDate(d.getDate()+30*(i+1));

function finishInstall(t){
  const c=+cu; if(!c) return toast('اختر عميلاً');
  const paid=Math.max(0,+$('#instPaid')?.value||0);
  if(paid>t) return toast('المدفوع أكبر من الإجمالي');
  const amts=[...document.querySelectorAll('.instAmt')].map(e=>+e.value||0);
  const dates=[...document.querySelectorAll('.instDate')].map(e=>e.value);
  if(!dates.every(d=>d)) return toast('حدد تاريخ كل قسط');
  const sum=Math.round(amts.reduce((a,b)=>a+b,0)*100)/100;
  const rem=Math.round((t-paid)*100)/100;
  if(Math.abs(sum-rem)>0.05) return toast('مجموع الأقساط يجب أن يساوي المتبقي ('+N(rem)+')');
  const plan=amts.map((amt,i)=>({amount:amt,due:dates[i],paid:false}));
  finalizeSale(t, paid, c, plan);
}
function finalizeSale(t, pd, c, plan){
  if(!Array.isArray(S.inst)) S.inst=[];
  const sid=(S.s.length?Math.max(...S.s.map(x=>x.id)):0)+1;
  const disc=window._saleDisc||0;
  const sub=window._saleSub||t;
  const s={id:sid,d:T,c:c||0,it:cart.map(i=>{const p=P(i.id);return{p:i.id,q:i.q,pr:p.pr,co:p.co,n:p.n,u:p.unit||''};}),t,pd,sub,disc,payType:plan.length?'install':'cash'};
  cart.forEach(i=>{
    const p=P(i.id); if(!p) return;
    p.q=Math.round((p.q-i.q)*100)/100;
    addLog('بيع', `${p.n} × ${i.q} — فاتورة #${sid}`, {pid:p.id,q:-i.q});
  });
  if(c){
    const cust=C(c);
    if(cust) cust.db=(cust.db||0)+(t-pd);
  }
  plan.forEach((p,idx)=>{
    S.inst.push({
      id:(S.inst.length?Math.max(...S.inst.map(x=>x.id)):0)+1+idx,
      saleId:sid, custId:c, amount:p.amount, due:p.due, paid:false, paidAt:null
    });
  });
  if(c){
    const next=S.inst.filter(x=>x.custId==c&&!x.paid).sort((a,b)=>a.due.localeCompare(b.due))[0];
    const cust=C(c); if(cust) cust.due=next?next.due:null;
  }
  S.s.push(s); cart=[]; cu=0; window._saleDisc=0; window._saleSub=0; cm(); save(); inv(s.id); toast('تم حفظ الفاتورة');
}
function returnSale(id){
  const s=S.s.find(x=>x.id==id); if(!s||s.returned) return toast('لا يمكن المرتجع');
  if(!confirm('مرتجع الفاتورة #'+id+'؟ سيتم إرجاع الكميات للمخزن')) return;
  s.it.forEach(i=>{
    const p=P(i.p); if(p){ p.q=Math.round((p.q+i.q)*100)/100; addLog('مرتجع', `${i.n||p.n} × ${i.q} — فاتورة #${id}`, {pid:i.p,q:i.q}); }
  });
  if(s.c){
    const cust=C(s.c);
    if(cust) cust.db=Math.max(0,(cust.db||0)-(s.t-s.pd));
  }
  (S.inst||[]).filter(x=>x.saleId==id).forEach(x=>{ x.paid=true; x.paidAt=T; x.returned=true; });
  s.returned=true;
  save(); cm(); toast('تم المرتجع'); go('s');
}

function markInstPaid(id){
  const x=S.inst.find(i=>i.id==id); if(!x||x.paid) return;

function localAssist(q){
  const qq=q.toLowerCase();
  const low=S.p.filter(p=>p.q<=p.m);
  const due=getDueInstallments(3);
  const todaySales=tot(T,T);
  const debt=S.c.reduce((a,c)=>a+(c.db||0),0);
  const p30=prof(D(-30)), p7=prof(D(-7));
  const ranked=S.p.map(p=>{
    const q30=sold(p.id,30);
    const margin=p.pr>0?((p.pr-p.co)/p.pr*100):0;
    const profit30=q30*(p.pr-p.co);
    return {p,q30,margin,profit30};
  }).sort((a,b)=>b.profit30-a.profit30);
  const hit=S.p.find(p=>qq.includes((p.n||'').toLowerCase())||(p.n&&q.includes(p.n)));
  if(hit){
    const q30=sold(hit.id,30);
    const margin=hit.pr>0?Math.round((hit.pr-hit.co)/hit.pr*100):0;
    return `📦 ${hit.n}\nسعر البيع: ${M(hit.pr)} · التكلفة: ${M(hit.co)} · الهامش: ${margin}%\nالمخزون: ${N(hit.q)} ${hit.unit||''} (الحد ${N(hit.m)})\nمباع آخر 30 يوم: ${N(q30)}\n${hit.e?'الصلاحية: '+hit.e+' ('+dl(hit.e)+' يوم)':''}`;
  }
  if(/مبيع|بيع اليوم|تحصيل|صافي|مصروف/.test(q)) return `مبيعات اليوم (${T}): ${M(todaySales)}\nمصروفات اليوم: ${M(expTotal(T,T))}\nصافي اليوم: ${M(netSales(T,T))}\nعدد الفواتير: ${S.s.filter(s=>s.d===T).length}\nأرباح تقريبية اليوم: ${M(S.s.filter(s=>s.d===T).reduce((a,s)=>a+s.it.reduce((b,i)=>b+(i.pr-i.co)*i.q,0),0))}`;
  if(/نقص|نواقص|مخزن/.test(q)) return low.length?('النواقص:\n'+low.map(p=>`• ${p.n}: ${N(p.q)} (الحد ${N(p.m)})`).join('\n')):'لا توجد نواقص حالياً.';
  if(/قسط|أقساط|مديون/.test(q)) return due.length?('أقساط قريبة:\n'+due.map(x=>`• ${(C(x.custId)?.n)||'عميل'}: ${M(x.amount)} يوم ${x.due}`).join('\n'))+`\nإجمالي الديون: ${M(debt)}`:`لا أقساط خلال 3 أيام.\nإجمالي ديون العملاء: ${M(debt)}`;
  if(/منتج|أصناف|قائمة/.test(q) && !/ربح|أرباح|زود|أعلى|ازاي|إزاي|خطة/.test(q)) return S.p.length?('المنتجات المسجّلة:\n'+S.p.slice(0,15).map(p=>`• ${p.n} — ${M(p.pr)} — مخزون ${N(p.q)}`).join('\n')):'لا منتجات مسجّلة بعد.';
  if(/عميل|عملاء/.test(q) && !/ربح|أرباح|زود|خطة/.test(q)) return S.c.length?('العملاء:\n'+S.c.slice(0,12).map(c=>`• ${c.n} — ${c.ph||'—'} — مديونية ${M(c.db||0)}`).join('\n')):'لا عملاء بعد.';
  // خطة زيادة الأرباح — تحليل ذكي من بيانات المحل
  if(/ربح|أرباح|زود|أعلى|ازاي|إزاي|خطة|مكسب|هامش|تسويق|بيع أكتر|ازود/.test(q)){
    const top=ranked.filter(x=>x.profit30>0).slice(0,5);
    const slow=ranked.filter(x=>x.p.q>x.p.m && x.q30===0).slice(0,5);
    const lowMargin=ranked.filter(x=>x.margin>0 && x.margin<15 && x.q30>0).slice(0,4);
    const exp=S.p.filter(p=>p.e&&dl(p.e)>=0&&dl(p.e)<=45).sort((a,b)=>dl(a.e)-dl(b.e)).slice(0,5);
    let out=`📈 خطة عملية لزيادة أرباح A&N Agro\n\nالوضع الحالي:\n• أرباح 30 يوم: ${M(p30)} · آخر 7 أيام: ${M(p7)}\n• مبيعات اليوم: ${M(todaySales)}\n• ديون العملاء: ${M(debt)}\n• نواقص: ${low.length} · أقساط قريبة: ${due.length}\n\n`;
    out+='① اعمل النهارده:\n';
    if(due.length) out+=`• حصّل الأقساط القريبة (${due.length}) — فلوس جاهزة من غير ما تشتري مخزون جديد.\n`;
    if(low.length) out+=`• ورّد النواقص: ${low.slice(0,4).map(p=>p.n).join('، ')} عشان متخسرش بيع.\n`;
    if(exp.length) out+=`• اعرض خصم سريع على قرب الانتهاء: ${exp.slice(0,3).map(p=>p.n+' ('+dl(p.e)+' يوم)').join('، ')}.\n`;
    if(!due.length && !low.length && !exp.length) out+='• راجع فواتير اليوم وركّز على إضافة صنف مكمل لكل فاتورة (upsell).\n';
    out+='\n② هذا الأسبوع:\n';
    if(top.length) out+=`• ركّز ترويج على أعلى ربح: ${top.slice(0,3).map(x=>x.p.n+' (~'+M(x.profit30)+')').join('، ')}.\n`;
    if(lowMargin.length) out+=`• راجع تسعير الهامش الضعيف: ${lowMargin.map(x=>x.p.n+' ('+Math.round(x.margin)+'%)').join('، ')} — زوّد السعر شوية أو اعمل باقة.\n`;
    if(slow.length) out+=`• أصناف راكدة (مخزون ومفيش بيع 30 يوم): ${slow.map(x=>x.p.n).join('، ')} — عرض أو اربطها ببيع صنف سريع.\n`;
    out+='• ابعت واتساب تذكير للعملاء اللي عليهم مديونية.\n';
    out+='\n③ هذا الشهر:\n• اعمل باقات (سماد + مبيد) بهامش أوضح من البيع المنفصل.\n• قبل الموسم اشترِ الأصناف سريعة الدوران بكميات أحسن عشان سعر الشراء.\n• متكدّسش أصناف بطيئة — رأس المال أحسن في اللي بيتحرك.\n';
    if(!S.p.length) out+='\n⚠️ سجّل المنتجات والمبيعات الأول عشان التحليل يبقى أدق.';
    return out;
  }
  if(/ربح|أرباح/.test(q)) return `أرباح آخر 30 يوم: ${M(p30)}\nأرباح آخر 7 أيام: ${M(p7)}`;
  return `أنا مساعد A&N Agro 🌱\nأقدر أجاوب عن الأسعار والمخزون والأرباح، وأعمللك خطة عملية تزود بيها المكسب من بيانات محلك.\n\nملخص سريع:\nمبيعات اليوم: ${M(todaySales)}\nأرباح 30 يوم: ${M(p30)}\nمنتجات: ${S.p.length} · عملاء: ${S.c.length}\nنواقص: ${low.length} · أقساط قريبة: ${due.length} · ديون: ${M(debt)}\n\nجرّب تسأل: «اعمللي خطة أزود بيها الأرباح»`;
}

/* ===================================================================
   PDF ENGINE — draws on a canvas and packs JPEG pages into a PDF.
   No external library, works the same on iPhone / Android / desktop.
   =================================================================== */
const PW=1240, PH=1754, PF='Cairo,Tahoma,Arial,sans-serif';
const PG_GREEN='#0f5132', PG_GOLD='#c9a227';
async function pdfFonts(){
  try{
    await Promise.race([
      Promise.all(['400','700','800'].map(w=>document.fonts.load(w+' 26px Cairo','أبجد ١٢٣ ABC'))),
      new Promise(r=>setTimeout(r,2500))]);
  }catch{}
}
const loadImg=src=>new Promise(res=>{ if(!src) return res(null); const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; });
function pgNew(){
  const c=document.createElement('canvas'); c.width=PW; c.height=PH; c.setAttribute('dir','rtl');
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,PW,PH);
  x.direction='rtl'; x.textBaseline='middle';
  return {c,x};
}
function rr(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
function tx(x,t,px,py,o={}){
  x.font=`${o.w||400} ${o.s||26}px ${PF}`; x.fillStyle=o.c||'#13241c'; x.textAlign=o.a||'right';
  t=String(t??'');
  if(o.max && x.measureText(t).width>o.max){ while(t.length>1 && x.measureText(t+'…').width>o.max) t=t.slice(0,-1); t+='…'; }
  x.fillText(t,px,py);
}
function pdfFooter(pages){
  pages.forEach((P,i)=>{
    const x=P.x;
    x.fillStyle='#e2ebe6'; x.fillRect(64,PH-162,PW-128,2);
    tx(x,'شكراً لتعاملكم مع A&N Agro',PW/2,PH-122,{s:30,w:800,c:PG_GREEN,a:'center'});
    tx(x,'للاستفسار: '+OWNER_PHONE,PW/2,PH-80,{s:24,c:'#6b7a72',a:'center'});
    tx(x,'حقوق النشر © 2026 — احمد الطباخ — 01065339946',PW/2,PH-46,{s:18,c:'#9aa8a0',a:'center'});
    x.fillStyle=PG_GREEN; x.fillRect(0,PH-18,PW,18);
    if(pages.length>1) tx(x,`صفحة ${i+1} من ${pages.length}`,64,PH-80,{s:22,c:'#6b7a72',a:'left'});
  });
}
function pdfBuild(pages){
  pdfFooter(pages);
  const cvs=pages.map(p=>p.c);
  const imgs=cvs.map(c=>c.toDataURL('image/jpeg',0.92));
  const enc=new TextEncoder(), parts=[], offs=[]; let off=0;
  const push=b=>{ if(typeof b==='string') b=enc.encode(b); parts.push(b); off+=b.length; };
  const obj=(id,body)=>{ offs[id]=off; push(id+' 0 obj\n'+body+'\nendobj\n'); };
  const n=cvs.length;
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${n} /Kids [${cvs.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] >>`);
  cvs.forEach((c,i)=>{
    const bin=atob(imgs[i].split(',')[1]); const jpg=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) jpg[k]=bin.charCodeAt(k);
    const pid=3+3*i, cid=4+3*i, iid=5+3*i, cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    obj(cid,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[iid]=off;
    push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
    push(jpg); push('\nendstream\nendobj\n');
  });
  const total=3+3*n, xr=off;
  let t=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++) t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  t+=`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  push(t);
  return {blob:new Blob(parts,{type:'application/pdf'}), imgs};
}
function saveBlob(r){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(r.blob); a.download=r.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
// Opens the phone's share sheet with the PDF file itself (WhatsApp appears in it)
async function sharePdf(r,phone,caption){
  window._curPdf=r; window._curPhone=phone; window._curCap=caption;

  if(!navigator.share) err='no-share';
  else{
    try{ await navigator.share({files:[new File([r.blob],r.name,{type:'application/pdf'})],title:r.name}); return; }
    catch(e){ if(e&&e.name==='AbortError') return; err=(e&&e.name)||'error'; }
  }
  shareFallback(err);
}
async function upTo(url,fd,pick,ms){
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),ms||20000);
  try{
    const res=await fetch(url,{method:'POST',body:fd,signal:ac.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const txt=await res.text();
    const link=pick(txt);
    if(!link||!/^https?:\/\//.test(link)) throw new Error('bad response');
    return link.replace('http://','https://');
  } finally { clearTimeout(t); }
}

const qf=n=>(+n||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
async function drawInvoice(s){
  await pdfFonts();
  const logo=await loadImg(window.LOGO);
  const c=C(s.c), inst=(S.inst||[]).filter(z=>z.saleId==s.id);
  const payLabel=s.payType==='install'?'قسط':'كاش';
  const remain=Math.max(0,(s.t||0)-(s.pd||0));
  const pages=[]; let P,x,y;
  const LIM=PH-200;
  const newPage=first=>{
    P=pgNew(); pages.push(P); x=P.x;
    if(first){
      x.fillStyle=PG_GREEN; x.fillRect(0,0,PW,270); x.fillStyle=PG_GOLD; x.fillRect(0,270,PW,10);
      let rx=PW-64;
      if(logo){ x.save(); rr(x,rx-128,71,128,128,26); x.clip(); x.drawImage(logo,rx-128,71,128,128); x.restore();
        x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=3; rr(x,rx-128,71,128,128,26); x.stroke(); rx-=128+28; }
      tx(x,'A&N Agro',rx,98,{s:52,w:800,c:'#fff'});
      tx(x,'للأسمدة والمبيدات الزراعية',rx,153,{s:27,c:'rgba(255,255,255,.93)'});
      tx(x,'هاتف '+OWNER_PHONE,rx,194,{s:24,c:'rgba(255,255,255,.85)'});
      x.fillStyle='rgba(255,255,255,.16)'; rr(x,64,52,300,166,22); x.fill();
      tx(x,'فاتورة رقم',214,88,{s:23,c:'rgba(255,255,255,.92)',a:'center'});
      tx(x,'#'+s.id,214,140,{s:54,w:800,c:'#fff',a:'center'});
      tx(x,s.d,214,192,{s:26,c:'#fff',a:'center'});
      y=316;
    } else {
      x.fillStyle=PG_GREEN; x.fillRect(0,0,PW,110); x.fillStyle=PG_GOLD; x.fillRect(0,110,PW,6);
      tx(x,`فاتورة #${s.id} — A&N Agro (تابع)`,PW-64,56,{s:34,w:800,c:'#fff'});
      y=170;
    }
  };
  newPage(true);
  // customer + payment cards
  const cw=(PW-128-28)/2, ch=250;
  const card=(X,label,lines)=>{
    x.fillStyle='#f3f7f4'; rr(x,X,y,cw,ch,18); x.fill(); x.strokeStyle='#dde7e0'; x.lineWidth=2; rr(x,X,y,cw,ch,18); x.stroke();
    const R=X+cw-28; tx(x,label,R,y+40,{s:22,c:'#6b7a72'}); lines(R);
  };
  card(PW-64-cw,'بيانات العميل',R=>{
    tx(x,c?.n||'عميل نقدي',R,y+94,{s:36,w:800,max:cw-56});
    if(c?.ph) tx(x,c.ph,R,y+142,{s:28,max:cw-56});
    if(c?.note) tx(x,c.note,R,y+188,{s:22,c:'#6b7a72',max:cw-56});
  });
  card(64,'تفاصيل الدفع',R=>{
    tx(x,payLabel,R,y+88,{s:36,w:800});
    let ly=y+134;
    tx(x,'المدفوع '+M(s.pd),R,ly,{s:27}); ly+=38;
    if(s.disc){ tx(x,'الخصم '+M(s.disc),R,ly,{s:25,c:'#b45309'}); ly+=38; }
    if(remain) tx(x,'المتبقي '+M(remain),R,ly,{s:28,w:800,c:'#b45309'});
    else tx(x,'مسدد بالكامل',R,ly,{s:26,w:700,c:'#059669'});
  });
  y+=ch+36;
  // products table
  const X0=64, XR=PW-64;
  const cols=[80,452,170,190,220]; // right → left
  const edges=[]; { let r=XR; cols.forEach(w=>{ edges.push([r-w,r]); r-=w; }); }
  const thead=(color,labels)=>{
    x.fillStyle=color; x.fillRect(X0,y,XR-X0,70);
    labels.forEach((l,i)=>{ const [a,b]=edges[i]; if(i===1) tx(x,l,b-18,y+36,{s:26,w:700,c:'#fff'}); else tx(x,l,(a+b)/2,y+36,{s:26,w:700,c:'#fff',a:'center'}); });
    y+=70;
  };
  tx(x,'المنتجات',XR,y+14,{s:32,w:800,c:PG_GREEN}); y+=52;
  const H1=['#','المنتج','الكمية','السعر','المبلغ'];
  thead(PG_GREEN,H1);
  s.it.forEach((i,idx)=>{
    if(y+96>LIM){ newPage(false); thead(PG_GREEN,H1); }
    x.fillStyle=idx%2?'#f4f8f5':'#ffffff'; x.fillRect(X0,y,XR-X0,96);
    x.strokeStyle='#dde7e0'; x.lineWidth=2; x.strokeRect(X0,y,XR-X0,96);
    edges.forEach(([a],k)=>{ if(k<4){ x.beginPath(); x.moveTo(a,y); x.lineTo(a,y+96); x.stroke(); } });
    tx(x,qf(idx+1),(edges[0][0]+edges[0][1])/2,y+48,{s:24,c:'#6b7a72',a:'center'});
    tx(x,invItemName(i),edges[1][1]-18,y+34,{s:29,w:700,max:cols[1]-36});
    tx(x,invItemUnit(i),edges[1][1]-18,y+70,{s:21,c:'#6b7a72',max:cols[1]-36});
    tx(x,qf(i.q),(edges[2][0]+edges[2][1])/2,y+48,{s:29,a:'center'});
    tx(x,N(i.pr),(edges[3][0]+edges[3][1])/2,y+48,{s:29,a:'center'});
    tx(x,N(i.q*i.pr),(edges[4][0]+edges[4][1])/2,y+48,{s:30,w:800,a:'center'});
    y+=96;
  });
  y+=30;
  // installments
  if(inst.length){
    if(y+200>LIM){ newPage(false); }
    tx(x,'جدول الأقساط',XR,y+14,{s:30,w:800,c:'#b45309'}); y+=50;
    const ic=[300,300,280,232]; const ie=[]; { let r=XR; ic.forEach(w=>{ ie.push([r-w,r]); r-=w; }); }
    const ih=()=>{ x.fillStyle='#b45309'; x.fillRect(X0,y,XR-X0,62);
      ['القسط','الموعد','المبلغ','الحالة'].forEach((l,i)=>{ const [a,b]=ie[i]; if(i===0) tx(x,l,b-18,y+32,{s:25,w:700,c:'#fff'}); else tx(x,l,(a+b)/2,y+32,{s:25,w:700,c:'#fff',a:'center'}); }); y+=62; };
    ih();
    inst.forEach((z,i)=>{
      if(y+68>LIM){ newPage(false); ih(); }
      x.fillStyle=i%2?'#fff7d6':'#fffbeb'; x.fillRect(X0,y,XR-X0,68); x.strokeStyle='#fde68a'; x.lineWidth=2; x.strokeRect(X0,y,XR-X0,68);
      tx(x,'قسط '+qf(i+1),ie[0][1]-18,y+34,{s:26});
      tx(x,z.due,(ie[1][0]+ie[1][1])/2,y+34,{s:26,a:'center'});
      tx(x,N(z.amount),(ie[2][0]+ie[2][1])/2,y+34,{s:27,w:800,a:'center'});
      tx(x,z.paid?'مسدد':'مستحق',(ie[3][0]+ie[3][1])/2,y+34,{s:26,w:700,c:z.paid?'#059669':'#b45309',a:'center'});
      y+=68;
    });
    y+=30;
  }
  // totals
  const rows=[];
  if(s.disc){ rows.push(['قبل الخصم',M((s.t||0)+(s.disc||0)),0]); rows.push(['الخصم','- '+M(s.disc),0]); }
  rows.push(['الإجمالي',M(s.t),1]); rows.push(['المدفوع',M(s.pd),0]);
  if(remain) rows.push(['المتبقي',M(remain),2]);
  const bh=rows.reduce((a,r)=>a+(r[2]===1?92:60),0)+36;
  if(y+bh>LIM) newPage(false);
  const bw=600, bx=64;
  x.fillStyle=PG_GREEN; rr(x,bx,y,bw,bh,22); x.fill();
  let ty=y+18;
  rows.forEach(r=>{
    const h=r[2]===1?92:60;
    if(r[2]===2){ x.fillStyle='rgba(255,255,255,.3)'; x.fillRect(bx+28,ty,bw-56,2); }
    tx(x,r[0],bx+bw-30,ty+h/2,{s:r[2]===1?32:26,w:r[2]?800:400,c:'#fff'});
    tx(x,r[1],bx+30,ty+h/2,{s:r[2]===1?46:r[2]===2?32:28,w:r[2]?800:400,c:'#fff',a:'left'});
    ty+=h;
  });
  return pages;
}

/* ---------- Generic table report PDF (نواقص، صلاحيات...) ---------- */
async function buildReportPdf(o){
  await pdfFonts();
  const logo=await loadImg(window.LOGO);
  const pages=[]; let P,x,y;
  const LIM=PH-190, XR=PW-64, X0=64, W=XR-X0, RH=o.rowH||70;
  const tw=o.cols.reduce((a,c)=>a+c.w,0);
  const edges=[]; { let r=XR; o.cols.forEach(c=>{ const w=W*c.w/tw; edges.push([r-w,r]); r-=w; }); }
  const thead=()=>{
    x.fillStyle=PG_GREEN; x.fillRect(X0,y,W,64);
    o.cols.forEach((c,i)=>{ const [a,b]=edges[i];
      if(c.a==='c') tx(x,c.h,(a+b)/2,y+33,{s:24,w:700,c:'#fff',a:'center',max:b-a-10});
      else tx(x,c.h,b-16,y+33,{s:24,w:700,c:'#fff',max:b-a-26}); });
    y+=64;
  };
  const newPage=first=>{
    P=pgNew(); pages.push(P); x=P.x;
    if(first){ pdfBrand(x,logo,o.title,o.sub); y=290; }
    else { x.fillStyle=PG_GREEN; x.fillRect(0,0,PW,100); x.fillStyle=PG_GOLD; x.fillRect(0,100,PW,6);
      tx(x,o.title+' (تابع)',XR,52,{s:32,w:800,c:'#fff'}); y=150; }
    thead();
  };
  newPage(true);
  o.rows.forEach((r,idx)=>{
    if(y+RH>LIM) newPage(false);
    x.fillStyle=idx%2?'#f4f8f5':'#fff'; x.fillRect(X0,y,W,RH);
    x.strokeStyle='#dde7e0'; x.lineWidth=2; x.strokeRect(X0,y,W,RH);
    edges.forEach(([a],k)=>{ if(k<edges.length-1){ x.beginPath(); x.moveTo(a,y); x.lineTo(a,y+RH); x.stroke(); } });
    o.cols.forEach((c,i)=>{ const [a,b]=edges[i]; const v=r[i];
      const col=(o.colorFn&&o.colorFn(r,i))||'#13241c';
      if(c.a==='c') tx(x,v,(a+b)/2,y+RH/2,{s:26,c:col,a:'center',max:b-a-12,w:c.b?700:400});
      else tx(x,v,b-16,y+RH/2,{s:27,w:700,c:col,max:b-a-28}); });
    y+=RH;
  });
  if(o.note){ y+=24; if(y+50>LIM) newPage(false); tx(x,o.note,XR,y+20,{s:24,c:'#6b7a72',max:W}); }
  const out=pdfBuild(pages); out.name=o.name; return out;
}

/* ---------- Invoice modal / actions ---------- */
const _invPdf={}, _invDone={};
function invSig(s){ return s.id+'|'+JSON.stringify([s.t,s.pd,s.disc,(S.inst||[]).filter(z=>z.saleId==s.id).map(z=>z.paid)]); }
function getInvPdf(id){
  const s=S.s.find(z=>z.id==id); if(!s) return Promise.resolve(null);
  const k=invSig(s);
  if(!_invPdf[k]){
    _invPdf[k]=(async()=>{
      try{
        const r=pdfBuild(await drawInvoice(s)); r.name=invFileName(s); _invDone[k]=r; return r;
      }catch(e){ delete _invPdf[k]; toast('تعذر إنشاء الفاتورة PDF'); return null; }
    })();
  }
  return _invPdf[k];
}
function inv(id){
  const s=S.s.find(x=>x.id==id); if(!s) return;
  const profit=s.it.reduce((a,i)=>a+(i.pr-i.co)*i.q,0);
  const fname=invFileName(s);
  $('#md').innerHTML=`<div class="mb"><div class="mc" style="max-width:600px;padding:12px">
    <h3>🧾 فاتورة #${s.id}</h3>
    <div id="invPreview" data-id="${s.id}" style="max-height:56vh;overflow:auto;border:1px solid var(--bd);border-radius:10px;background:#fff;min-height:110px;display:flex;align-items:center;justify-content:center;color:#555;font-size:14px">⏳ جاري تجهيز الفاتورة...</div>
    <div class="bar" style="margin-top:10px">
      <button type="button" class="s" id="invProfBtn" onclick="toggleInvProfit()">عرض الربح</button>

    </div>
    <p style="font-size:12px;color:var(--mut);margin:6px 0">اسم الملف: <b>${E(fname)}</b></p>
    <div class="bar" style="margin-top:6px">
      <button class="b" id="invSaveBtn" disabled style="opacity:.5" onclick="downloadInvPdf(${s.id})">⬇️ حفظ PDF</button>
      <button class="b" id="invWaBtn" disabled style="background:#25a244;opacity:.55" onclick="waInvPdf(${s.id})">⏳ جاري التجهيز...</button>
      ${!s.returned?`<button class="s danger" onclick="returnSale(${s.id})">↩ مرتجع</button>`:'<span class="r">مرتجعة</span>'}
      <button class="s" onclick="cm()">إغلاق</button>

  </div></div>`;

  });

function toggleInvProfit(){
  const box=$('#invProfBox'), btn=$('#invProfBtn');

function downloadInvPdf(id){
  const s=S.s.find(z=>z.id==id); const r=s&&_invDone[invSig(s)];

/* الأقساط (تقويم) */
let _cal={y:0,m:0};
function showDueSoon(){
  if(V==='pg' && PGS.length && PGS[PGS.length-1].cal){ vw(); return; }
  const n=new Date(); _cal={y:n.getFullYear(),m:n.getMonth()};
  openPage('⏰ تقويم الأقساط',instCalHtml,{cal:true});
}
function renderInstCalendar(y,m){ _cal={y,m}; if(V==='pg'&&PGS.length&&PGS[PGS.length-1].cal) vw(); else showDueSoon(); }
function instCalHtml(){
  const {y,m}=_cal, dueSoon=getDueInstallments(3);
  if(!Array.isArray(S.inst)) S.inst=[];
  const byDate={};
  S.inst.filter(x=>!x.paid && x.due).forEach(x=>{ (byDate[x.due]=byDate[x.due]||[]).push(x); });
  const first=new Date(y,m,1), dim=new Date(y,m+1,0).getDate();
  // أسبوع يبدأ الاثنين: 0=ن ... 6=ح
  const startDow=(first.getDay()+6)%7;
  const monthName=first.toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=byDate[ds]?.length||0;
    const daysLeft=dl(ds);
    const soon=has && daysLeft<=3 && daysLeft>=0;
    const overdue=has && daysLeft<0;
    cells+=`<button type="button" class="cal-cell ${has?'has':''} ${ds===T?'today':''} ${soon||overdue?'soon':''}" onclick="showDayInst('${ds}')"><span class="d">${d}</span>${has?`<span class="dot">${has}</span>`:''}</button>`;
  }
  // أكمل الصف الأخير لـ 7 أعمدة
  const totalCells=startDow+dim;
  const pad=(7-(totalCells%7))%7;
  for(let i=0;i<pad;i++) cells+='<div class="cal-cell empty"></div>';
  return `<div class="cd">
    <div class="cal-nav">
      <button class="s" type="button" onclick="renderInstCalendar(${m===11?y+1:y},${m===11?0:m+1})">الشهر التالي ‹</button>
      <b>${monthName}</b>
      <button class="s" type="button" onclick="renderInstCalendar(${m===0?y-1:y},${m===0?11:m-1})">› الشهر السابق</button>
    </div>
    <div class="cal-wrap">
      <div class="cal-grid-head"><span>ن</span><span>ث</span><span>ر</span><span>خ</span><span>ج</span><span>س</span><span>ح</span></div>
      <div class="cal-grid">${cells}</div>
    </div>
    <p style="font-size:11px;color:var(--mut);margin-top:8px;text-align:center">ن=الاثنين · اضغط على يوم لعرض أقساطه</p>
  </div>
  <div class="cd"><h3 style="margin-bottom:6px">أقساط خلال 3 أيام</h3><div id="dayInstList">
    ${dueSoon.length?dueSoon.map(x=>{ const cust=C(x.custId);
      return `<p style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd)">
        <span><b>${E(cust?.n||'عميل')}</b><br><small>${x.due} · ${M(x.amount)}</small></span>
        <span style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="s" onclick="markInstPaid(${x.id});showDueSoon()">تم</button>
          <a class="b" target="_blank" href="${wa(cust?.ph,'السلام عليكم أستاذ '+(cust?.n||'')+'، نذكركم بموعد سداد قسطكم يوم '+x.due+' بمبلغ '+M(x.amount)+' لدى A&N Agro.')}">واتساب</a>
        </span></p>`; }).join(''):emptyBox('لا أقساط قريبة')}
  </div></div>`;
}

/* تقرير يومي */
function dailyData(){
  const sales=S.s.filter(s=>s.d===T);
  const total=sales.reduce((a,s)=>a+s.t,0);
  const profit=sales.reduce((a,s)=>a+s.it.reduce((b,i)=>b+(i.pr-i.co)*i.q,0),0);
  const cash=sales.reduce((a,s)=>a+s.pd,0);
  const expenses=expTotal(T,T);
  const net=total-expenses;
  return {sales,total,profit,cash,expenses,net,due:getDueInstallments(3),low:S.p.filter(p=>p.q<=p.m)};
}
function dailyReport(){ openPage('📊 التقرير اليومي — '+T,()=>{
  const d=dailyData();
  return `<div class="pgb"><button class="b" onclick="dailyReportWa()">📤 واتساب (نص)</button><button class="b" onclick="dailyReportPdf()">🖨️ PDF</button></div>
  <div class="kg">${card('💵','مبيعات اليوم',M(d.total),'','',true)}${card('📈','الربح التقريبي',M(d.profit),'gd','',true)}
    ${card('🧾','عدد الفواتير',N(d.sales.length),'','',true)}${card('💰','المحصل',M(d.cash),'','',true)}
    ${card('💸','مصروفات اليوم',M(d.expenses),'','',true)}${card('✨','صافي اليوم',M(d.net),'gd','',true)}</div>
  <div class="cd"><p>أقساط قريبة (3 أيام): <b>${N(d.due.length)}</b></p><p>نواقص المخزن: <b class="${d.low.length?'r':''}">${N(d.low.length)}</b></p></div>`; }); }
function dailyReportWa(){
  const d=dailyData();
  const txt=`تقرير A&N Agro — ${T}\n────────────\nمبيعات اليوم: ${M(d.total)}\nمصروفات اليوم: ${M(d.expenses)}\nصافي اليوم: ${M(d.net)}\nعدد الفواتير: ${d.sales.length}\nالربح التقريبي: ${M(d.profit)}\nالمحصل كاش/مقدم: ${M(d.cash)}\nأقساط قريبة (3 أيام): ${d.due.length}\nنواقص المخزن: ${d.low.length}\n────────────\n${d.due.slice(0,5).map(x=>`• ${(C(x.custId)?.n)||'عميل'} — ${M(x.amount)} يوم ${x.due}`).join('\n')}\n${d.low.slice(0,5).map(p=>`• ناقص: ${p.n} (${N(p.q)})`).join('\n')}`;
  openWa(OWNER_PHONE,txt);
}
async function dailyReportPdf(){
  const d=dailyData(); toast('جاري تجهيز PDF...',false);
  try{
    const rows=[['مبيعات اليوم',M(d.total)],['عدد الفواتير',N(d.sales.length)],['الربح التقريبي',M(d.profit)],['المحصل كاش/مقدم',M(d.cash)],['أقساط قريبة (3 أيام)',N(d.due.length)],['نواقص المخزن',N(d.low.length)]];
    d.sales.forEach(s=>rows.push(['فاتورة #'+s.id+' — '+(C(s.c)?.n||'نقدي'),M(s.t)]));
    const r=await buildReportPdf({title:'التقرير اليومي',sub:T,name:`تقرير-يومي-${T}.pdf`,
      cols:[{h:'البند',w:6},{h:'القيمة',w:4,a:'c',b:1}],rows});
    showPdfModal(r,'🖨️ التقرير اليومي');
  }catch(e){ toast('تعذر إنشاء PDF'); }
}

/* Router */
const VIEWS={
  home:vHome, pg:vPg, p:vp, s:vs, c:vcu, o:vo, e:ve, g:vg, r:vr, a:vc, admin:vAdmin
};
function vw(){
  const fn=VIEWS[V]||vHome;
  $('#v').innerHTML=fn();
  renderNav();
  $('#hdrTitle').textContent=(navItems||DEFAULT_NAV).find(x=>x.id===V)?.label||'A&N Agro';
}

/* Boot */
(async()=>{
  window.LOGO = typeof EMBEDDED_LOGO !== 'undefined' ? EMBEDDED_LOGO : '';
  if(window.LOGO){
    $('#spLogo').src=window.LOGO;
    $('#hdrLogo').src=window.LOGO;
  }

  let p=0, ok=0, done=false;
  const setProgress=(v)=>{
    p=Math.max(p, Math.min(100, v));
    const bar=$('#pb'), pt=$('#pt');
    if(bar) bar.style.width=p+'%';
    if(pt) pt.textContent=Math.floor(p)+'%';
    if(p>=100 && ok && !done){
      done=true;
      clearInterval(iv);
      setTimeout(()=>$('#sp').classList.add('h'),350);
    }
  };
  const iv=setInterval(()=>{
    // شريط يتقدم بسلاسة حتى 92% أثناء التحميل، ثم يكمل لـ 100% عند الجاهزية
    if(!ok){
      if(p<60) setProgress(p+3.2);
      else if(p<85) setProgress(p+1.4);
      else if(p<92) setProgress(p+0.35);
    } else {
      setProgress(p+8);
    }
  },40);
  // ضمان الوصول لـ 100% حتى لو حصل تأخير
  setTimeout(()=>{ ok=1; setProgress(100); }, 4500);

  S=seed();
  navItems=JSON.parse(JSON.stringify(DEFAULT_NAV));
  // 1) embedded boot from saved HTML file
  if(window.__BOOT_DATA__){
    try{
      const b=window.__BOOT_DATA__;
      if(b.S) S=b.S;
      if(b.nav) navItems=b.nav;
      if(b.admin) admin=!!b.admin;
    }catch{}
  }
  // 2) localStorage (browser persistence)
  loadLocal();
  if(!S.settings) S.settings={showCost:false, theme:'auto'};
  if(!Array.isArray(S.p)) S.p=[];
  if(!Array.isArray(S.log)) S.log=[];
  if(!Array.isArray(S.inst)) S.inst=[];
  applyTheme();
  renderNav();
  vw();

  try{
    await new Promise(r=>setTimeout(r,200));
    if(typeof claude!=='undefined'&&claude.use){
      const d=await claude.use('db');
      if(d){
        doc=d.doc('shop/main');
        const s=await doc.get();
        if(s.exists){
          const data=s.data();
          // merge cloud only if it has more products/sales
          const cloudP=(data.p||[]).length, localP=(S.p||[]).length;
          if(cloudP>=localP && (data.s||[]).length>=(S.s||[]).length){
            S=data;
            if(data.nav) navItems=data.nav;
            if(data.admin!=null) admin=!!data.admin;
          } else {
            try{ await doc.set(JSON.parse(JSON.stringify({...S,nav:navItems,admin}))); }catch{}
          }
          if(!S.settings) S.settings={showCost:false};
        } else {
          try{ await doc.set(JSON.parse(JSON.stringify({...S,nav:navItems,admin}))); }catch{}
        }
        doc.onSnapshot(s=>{
          if(s.exists&&!s.metadata.hasPendingWrites){
            const data=s.data();
            S=data;
            if(data.nav) navItems=data.nav;
            try{ localStorage.setItem('an_agro_data', JSON.stringify(S)); }catch{}
            vw();
          }
        });
      }
    }
  }catch{}
  ok=1; setProgress(100); renderNav(); vw();
})();
</script>
